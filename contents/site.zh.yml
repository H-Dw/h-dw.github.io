research:
  eyebrow: 研究
  title: 两条主线，一个闭环
  intro: >-
    第一条主线问的是：当被生成的对象是**结构**——那些互相约束的几何体，
    每个局部都合理并不等于整体合理——表征应该长什么样。
    第二条问的是：围绕这个生成器的流程，应该拿自己的历史做什么，
    而不是对每个问题都执行同一串固定调用。
    两条线在推理阶段交汇，而事实证明大部分收益就在那里。
  core_label: 核心工作
  details_label: 方法贡献
  tracks:
    - id: latent
      numeral: I
      label: 隐空间生成式结构设计
      note: >-
        构建模型工作于其中的那个空间——什么必须挺过 bottleneck、
        彼此耦合的实体如何被联合表征，以及产出的空间能不能在不解码的前提下被搜索。
      stages:
        - id: space
          core: true
          title: 统一复合体隐空间中的协同去噪
          subtitle: 相互作用实体的联合生成与隐空间搜索
          tags:
            - { text: "NeurIPS 2026 · 审稿中", kind: accent }
            - { text: "第一作者", kind: accent }
          question: >-
            当模型必须产出两个必须彼此契合的对象时，通行做法是冻结其中一个、以它为条件生成另一个。
            于是两者之间的界面变成了一个假设，而不是模型真正表征的东西，
            共享的不确定性与协同形变也就无处安放。
            在结合蛋白设计中，这体现为堆积松散、接触效率低。
          insight: >-
            把整对对象投影到**单一隐空间**，让两侧一起去噪。
            界面处的几何耦合会自然涌现，无需在坐标空间反复解码与搜索——
            同时换来低廉的推理成本和物理上真正嵌合的产出。
          contributions:
            - title: 一种保住关系的表征
              text: >-
                互作感知的全原子自编码器，其 bottleneck 同时保留单个实体的几何与实体间的关系拓扑。
                在 CASP 复合物测试集上重建达到 **DockQ > 0.90**，显著优于基线，且单体性能不退化。
                隐空间距离与笛卡尔空间的结构差异高度相关，且在不同噪声水平下保持稳定——
                这正是该空间可被搜索的前提。
            - title: 联合去噪，而非条件生成
              text: >-
                训练阶段在**联合状态**上定义概率路径，而不是以冻结的伙伴为条件，
                因而每一侧都可以自适应于另一侧。
                诱导契合从"被忽略的东西"变成"被显式表征的东西"。
            - title: 在空间内部搜索
              text: >-
                打分、分支、剪枝、回滚全部直接作用于中间隐状态，任何候选都不必解码到坐标空间才能被评判。
                推理耗时与显存开销仅为 Complexa 的 **28.7%** 和 **11.6%**，可设计性提升 **20.8%**。
            - title: 产出是什么样的
              text: >-
                在界面处的接触效率和局部堆积密度上均优于所对比的方法：
                几何形状物理合理、界面质量具有竞争力，足以作为下游优化的优质种子。
          metrics:
            - { value: "> 0.90", label: "CASP 复合物全原子 DockQ" }
            - { value: "28.7%", label: "推理耗时（对比基线）" }
            - { value: "11.6%", label: "显存开销（对比基线）" }
            - { value: "+20.8%", label: "可设计性" }

        - id: signal
          title: "FANGS：从表征几何里读出决策"
          subtitle: 用隐空间距离作为验证器的零样本排序
          tags:
            - { text: "论文撰写中", kind: muted }
            - { text: "已获湿实验验证", kind: accent }
          question: >-
            生成模型产出候选的速度远快于任何人验证它们的速度，排序才是瓶颈。
            而大家惯用的置信度分数训练自另一个目标函数，
            与"这个设计到底能不能用"的相关性很弱。
          insight: >-
            如果隐空间建得好，**其中的距离本身就是任务信号**。
            先把功能态构象固定住，再用片段级隐空间结构嵌入的相似度度量兼容度。
            生成器与验证器共用同一个模型，不额外训练任何分类器。
          contributions:
            - title: 先控制状态，再打分
              text: >-
                用多模态模型的条件生成先锁定功能构象，使比较发生在同类状态之间。
                在测试案例中，结构误差相比 AlphaFold3 预测降低 **39%**。
            - title: 片段级兼容度
              text: >-
                兼容度被定义为局部性质，而非全局能量最优。
                相比全局评分，与实测量的 Spearman 相关系数提升 **超过 0.5**。
            - title: 它在实验上站住了
              text: >-
                在亲和力约 35–150 nM 的五个骨架上，实测值与打分顺序一致，
                而 ipTM 与 pTM 在这个区间几乎没有区分度。
                同一打分在两个独立的设计任务中都筛出了产量更优、亲和力更优的框架。
          metrics:
            - { value: "−39%", label: "结构误差（对比 AlphaFold3）" }
            - { value: "+0.5", label: "Spearman（对比全局评分）" }
            - { value: "5/5", label: "骨架排序与实测一致" }

        - id: prior
          title: "ESM3-MD：把先验注入提议分布"
          subtitle: 让预训练模型吸收模拟动力学中的监督信号
          tags:
            - { text: "进行中", kind: muted }
            - { text: "同方向工作在投 NeurIPS 2026 · 三作", kind: muted }
          question: >-
            预训练结构模型能自信地采出一个模态，却对它周围的分布毫无概念；
            模拟能覆盖那个分布，但昂贵到无法反复查询。
            两条路都拿不到系统真实访问过的那些状态。
          insight: >-
            轨迹中的时间演化信息可以被压缩成**逐位点的条件概率分布**，
            再通过 LoRA 注入结构模块——这是在"激活"通用模型本就潜在具备的能力，
            而不是重新训练一个。表征就是领域证据进入生成器的那个接口。
          contributions:
            - title: 把证据当作分布，而不是标签
              text: >-
                每一帧被编码为离散的逐位点表征，再聚合成目标分布，
                因而局部状态之间的相对概率被保留下来，而不是塌缩成一个答案。
                两条路径把提议分布推向它：KL 微调与推理时 logit 偏置。
            - title: 共进化语料与 Prompt 搜索
              text: >-
                由同源片段构建的语料携带共进化信号，Prompt 以多目标组合优化调优。
                相比预训练基线，与异构态的距离降低 **10%**，中间态多样性提升 **9%**。
            - title: 结果
              text: >-
                微调后的模型在具有明显构象变化的蛋白上同时采到了两端状态，
                探索的空间更广，构象覆盖率提升约 **22%**。
          metrics:
            - { value: "−10%", label: "与异构态的距离" }
            - { value: "+9%", label: "中间态多样性" }
            - { value: "+22%", label: "构象覆盖率" }

    - id: agents
      numeral: II
      label: 自进化智能体
      note: >-
        让围绕生成器的流程学会适应——读取经过验证的历史、
        改写下一轮的策略，并把事后证明值得留下的经验保存下来。
      stages:
        - id: harness
          title: 面向结构生成的自进化 Harness
          subtitle: 固定算力预算下的 verifier-guided 序列决策
          tags:
            - { text: "系统 · 闭环", kind: muted }
          question: >-
            大多数生成流水线是固定的：采样、过滤、汇报。
            真正起作用的那些参数靠经验设定，之后无论中间结果和失败模式说了什么都不会被修正。
            在困难实例上，算力就这样持续投进已知的死路。
          insight: >-
            把生成当作一个 **verifier-guided 序列决策问题**。
            控制器读取当前实例与自身历史轨迹的验证结果，改写下一轮的配置与分支决策——
            在固定预算下优化整个过程，而不是对完整候选做一次性筛选。
          contributions:
            - title: 把配置本身变成决策变量
              text: >-
                长度、条件化目标、局部模板、过滤阈值、采样预算，
                全部根据每轮反馈更新，而不是在第一次调用之前就固定下来。
            - title: 前进、分支、回滚、停止
              text: >-
                可回放的闭环 Harness 用复合 reward 在四个动作之间做选择，
                让质量退化的分支及时停止消耗算力，而不是跑完才被丢掉。
                在其中一个靶点上，正是回滚在中段失序之后把系统拉回了有效路径。
            - title: 让经验活过它所在的那一轮
              text: >-
                高质量的局部界面被存成可检索的片段模板，
                在后续轮次作为生成约束或配置先验复用，
                使"局部有效但全局不稳定"的结构不被丢弃。
                8 轮之后，两个靶点的 best ipTM 分别提升 **11%** 和 **12%**，
                Refolding 成功数提升 **7 倍**和 **2.82 倍**，且两者是沿不同的配置路径收敛的。
          metrics:
            - { value: "+11% / +12%", label: "两个靶点的 best ipTM" }
            - { value: "7× / 2.82×", label: "Refolding 成功数" }
            - { value: "8", label: "闭环迭代轮数" }

        - id: evoseek
          title: "EvoSEEK：证据治理型多智能体搜索"
          subtitle: 让外部知识与实验记忆变得可追溯、可复用
          tags:
            - { text: "系统 · 多智能体", kind: muted }
          question: >-
            在少样本、强交互效应和硬预算下搜索指数级空间，
            本该是 LLM 智能体发挥作用的地方。
            但它们把外部文献和自己的跨轮记忆放在两个孤岛里，
            结果是证据互相冲突，同一个失败被重复尝试两次。
          insight: >-
            把它重构为**证据治理型序列决策问题**。
            冻结的知识图谱与实验记忆图谱把文献与反馈沉淀为可追溯、可复用的决策先验，
            再由分层 Multi-Agent 跨轮生成、审查并修订可证伪的假设。
          contributions:
            - title: 双图谱证据治理
              text: >-
                Deep Research / RAG 的产出被冻结为可引用的知识图谱，
                记忆图谱把每个假设与它的观察绑定；
                EvidencePack 按来源、时效和选择资格对可用证据实施门控。
            - title: fail-closed 合同下的分层推理
              text: >-
                三组 Scientist–Critic 从不同前提出发互相质证；
                Agent-UQ 在假设靶向、探索与对照之间做平衡；
                ReThink 环节把结果写回跨轮记忆。
            - title: 记忆到底有没有用
              text: >-
                同折无泄漏消融中，实验记忆相较 Agent-only 在 **3/3 folds** 上同时提升
                final best-seen（+0.940 ± 0.524）与 AULC（+0.500 ± 0.151）；
                三通道证据条件的 final best-seen 在 8 种策略中居首（5.657 ± 0.534），
                且是唯一连续三轮持续提升的策略。
          metrics:
            - { value: "3 / 3", label: "记忆带来提升的折数" }
            - { value: "+0.940", label: "final best-seen（对比 Agent-only）" }
            - { value: "8 选 1", label: "证据策略中排名第一" }

