hero:
  name: Dawei Huang
  name_native: 黄达威
  eyebrow: AI for Science · Protein design
  thesis: >-
    When a model has to generate **several interacting entities at once**,
    the representation space decides everything — what survives compression,
    what can be generated jointly, and what you are able to search.
    I design those spaces, and the search that runs inside them.
  figure:
    title: Residue contact map of a two-chain complex
    caption: >-
      Most generative methods hold the target fixed and model only the binder,
      so the off-diagonal block is assumed rather than learned. I denoise the
      whole complex jointly — that block is the work.
