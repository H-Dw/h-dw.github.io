# The strip under the hero — the diagram is drawn by js/latent-search.js and
# these three labels sit beneath its three zones.
process:
  eyebrow: The loop
  stages:
    - label: Latent prior
      note: A space compact enough to generate in, and regular enough to search.
    - label: Verifier-guided search
      note: Score, branch, prune and roll back inside the space, before anything is decoded.
    - label: Structure
      note: Geometry that survives being checked.
  caption: >-
    A generator proposes, a verifier scores, and the loop decides where to look
    next. Both halves of my work are in this picture — the space the proposals
    are drawn from, and the policy that spends the budget.

