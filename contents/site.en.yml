research:
  eyebrow: Research
  title: Two tracks, one loop
  intro: >-
    The first track asks what a representation should look like when the thing
    being generated is *structure* — geometric objects that constrain each
    other, where a plausible part does not make a plausible whole. The second
    asks what the process around that generator should do with its own history,
    instead of running the same fixed sequence of calls on every problem. The
    two meet at inference time, which is where most of the leverage turned out
    to be.
  core_label: Core work
  details_label: Method contributions
  tracks:
    - id: latent
      numeral: I
      label: Latent generative structure design
      note: >-
        Building the space the model works in — what has to survive the
        bottleneck, how coupled entities are represented together, and whether
        the result can be searched without decoding.
      stages:
        - id: space
          core: true
          title: Co-denoising in a unified complex latent space
          subtitle: Joint generation and latent-space search for interacting entities
          tags:
            - { text: "NeurIPS 2026 · under review", kind: accent }
            - { text: "First author", kind: accent }
          question: >-
            When a model has to produce two objects that must fit each other,
            the standard move is to freeze one and condition on it. The
            interface between them then becomes an assumption rather than
            something the model represents, and shared uncertainty and
            coordinated deformation have nowhere to live. In binder design this
            shows up as loose packing and poor contact efficiency.
          insight: >-
            Project the whole pair into a **single latent space** and denoise
            both sides together. Geometric coupling at the interface emerges on
            its own, with no repeated decoding and searching in coordinate
            space — which buys cheap inference and physically complementary
            output at the same time.
          contributions:
            - title: A representation that keeps the relation
              text: >-
                An interaction-aware all-atom autoencoder whose bottleneck holds
                per-entity geometry and the relational topology between entities
                at once. Reconstruction reaches **DockQ > 0.90** on the CASP
                complex test set, well ahead of baselines, with monomer
                performance intact. Latent distances track Cartesian structural
                difference and stay stable under noise, which is what makes the
                space searchable.
            - title: Joint denoising instead of conditioning
              text: >-
                Training defines a probability path over the **joint** state
                rather than conditioning on a frozen partner, so each side is
                free to adapt to the other. Induced fit becomes something the
                model represents rather than something it ignores.
            - title: Search inside the space
              text: >-
                Scoring, branching, pruning and rollback operate directly on
                intermediate latent states, so no candidate is decoded to
                coordinates to be judged. Inference runs at **28.7%** of the
                time and **11.6%** of the memory of Complexa, and designability
                improves **20.8%**.
            - title: What comes out
              text: >-
                Better contact efficiency and local packing density at the
                interface than the compared methods — geometrically plausible,
                competitive interface quality, good enough as seeds for
                downstream optimisation.
          metrics:
            - { value: "> 0.90", label: "All-atom DockQ, CASP complexes" }
            - { value: "28.7%", label: "Inference time vs. baseline" }
            - { value: "11.6%", label: "GPU memory vs. baseline" }
            - { value: "+20.8%", label: "Designability" }

        - id: signal
          title: "FANGS: reading a decision out of representation geometry"
          subtitle: Zero-shot ranking with a latent-distance verifier
          tags:
            - { text: "Manuscript in preparation", kind: muted }
            - { text: "Wet-lab validated", kind: accent }
          question: >-
            Generative models produce candidates faster than anyone can test
            them, so ranking is the bottleneck. The usual confidence scores are
            trained for a different objective than the one that matters, and
            correlate weakly with whether a design actually works.
          insight: >-
            If the latent space is built well, **distance in it is already a
            task signal**. Fix the functional-state conformation, then score
            compatibility as similarity between fragment-level latent structure
            embeddings. Generator and verifier share one model; no separate
            classifier is trained.
          contributions:
            - title: Controlling the state before scoring it
              text: >-
                Conditional generation with a multimodal model pins the
                functional conformation first, so the comparison is made between
                like states. Structural error fell **39%** against the
                AlphaFold3 prediction on the test case.
            - title: Fragment-level compatibility
              text: >-
                Compatibility is defined locally rather than as a global energy
                optimum. Against global scoring, Spearman correlation with the
                measured quantity improved by **more than 0.5**.
            - title: It held up in the lab
              text: >-
                Affinity measurements tracked the score across five scaffolds
                spanning roughly 35–150 nM, where ipTM and pTM separated
                nothing. The same score selected better-yield, better-affinity
                frameworks in two independent design campaigns.
          metrics:
            - { value: "−39%", label: "Structural error vs. AlphaFold3" }
            - { value: "+0.5", label: "Spearman vs. global score" }
            - { value: "5/5", label: "Scaffolds ranked in measured order" }

        - id: prior
          title: "ESM3-MD: putting a prior into the proposal distribution"
          subtitle: Turning simulated dynamics into supervision a pretrained model can absorb
          tags:
            - { text: "Ongoing", kind: muted }
            - { text: "Related work under review at NeurIPS 2026 · third author", kind: muted }
          question: >-
            A pretrained structure model samples one mode confidently and has no
            notion of the distribution around it. Simulation covers that
            distribution but is far too expensive to query. Neither route gives
            cheap access to the states a system actually visits.
          insight: >-
            The temporal information in a trajectory can be compressed into a
            **per-position conditional distribution** and injected into the
            structure module through LoRA — activating a capability the general
            model already latently has rather than training a new one. The
            representation is the interface through which domain evidence
            enters the generator.
          contributions:
            - title: Evidence as a distribution, not a label
              text: >-
                Frames are encoded as discrete per-position representations and
                aggregated into a target distribution, so relative probabilities
                of local states are preserved instead of collapsed to one
                answer. Two routes move the proposal toward it: KL fine-tuning
                and inference-time logit bias.
            - title: Co-evolutionary corpus and prompt search
              text: >-
                A corpus built from homologous fragments carries co-evolutionary
                signal; the prompt is tuned by multi-objective combinatorial
                optimisation. Against the pretrained baseline, distance to the
                alternative state dropped **10%** and intermediate-state
                diversity rose **9%**.
            - title: Result
              text: >-
                The fine-tuned model sampled both end states of proteins with
                clear conformational change and explored a broader space, with
                coverage up roughly **22%**.
          metrics:
            - { value: "−10%", label: "Distance to alternative state" }
            - { value: "+9%", label: "Intermediate diversity" }
            - { value: "+22%", label: "Conformational coverage" }

    - id: agents
      numeral: II
      label: Self-improving agents
      note: >-
        Making the process around the generator adapt — read the verified
        history, rewrite the next round's strategy, and keep the experience
        that turned out to be worth keeping.
      stages:
        - id: harness
          title: A self-improvement harness for structure generation
          subtitle: Verifier-guided sequential decisions under a fixed compute budget
          tags:
            - { text: "System · closed loop", kind: muted }
          question: >-
            Most generation pipelines are fixed: sample, filter, report. The
            knobs that matter are set from experience and never revised, no
            matter what the intermediate results or the failure modes say. On
            hard instances the budget keeps going into directions already known
            to be dead.
          insight: >-
            Treat generation as a **verifier-guided sequential decision
            problem**. A controller reads the instance and the verified history
            of its own trajectories, then rewrites the next round's
            configuration and branch decisions — optimising the whole process
            under a fixed budget rather than filtering finished candidates once.
          contributions:
            - title: Configuration as the decision variable
              text: >-
                Length, conditioning targets, local templates, filter thresholds
                and sampling budget are all updated from each round's feedback,
                rather than fixed before the first call.
            - title: Advance, branch, roll back, stop
              text: >-
                A replayable closed-loop harness uses a composite reward to pick
                among four moves, so a degrading branch stops consuming compute
                instead of running to completion. On one target, rollback was
                what recovered a productive path after the middle rounds went
                sideways.
            - title: Experience that survives the round it came from
              text: >-
                High-quality local interfaces are stored as retrievable
                fragment templates and reused as generation constraints or
                configuration priors, so structure that is locally useful but
                globally unstable is not thrown away. Over 8 rounds, best ipTM
                rose **11%** and **12%** on two targets, with successful
                refolds up **7×** and **2.82×**. The two targets converged
                through different configuration paths.
          metrics:
            - { value: "+11% / +12%", label: "Best ipTM on two targets" }
            - { value: "7× / 2.82×", label: "Successful refolds" }
            - { value: "8", label: "Closed-loop rounds" }

        - id: evoseek
          title: "EvoSEEK: evidence-governed multi-agent search"
          subtitle: Making external knowledge and experimental memory auditable
          tags:
            - { text: "System · multi-agent", kind: muted }
          question: >-
            Searching an exponential space from few samples, under strong
            interaction effects and a hard budget, is where LLM agents should
            help. But they keep external literature and their own cross-round
            memory in separate silos, which produces conflicting evidence and
            the same failure attempted twice.
          insight: >-
            Reframe it as an **evidence-governed sequential decision problem**.
            A frozen knowledge graph and an experimental-memory graph turn
            literature and feedback into traceable, reusable decision priors,
            and a hierarchical multi-agent system proposes, reviews and revises
            falsifiable hypotheses across rounds.
          contributions:
            - title: Dual-graph evidence governance
              text: >-
                Deep Research and RAG output is frozen into a citable knowledge
                graph; a memory graph ties each hypothesis to its observation.
                An EvidencePack gates what may be used, by source, recency and
                selection eligibility.
            - title: Hierarchical reasoning under a fail-closed contract
              text: >-
                Three Scientist–Critic pairs argue from different premises;
                Agent-UQ balances hypothesis targeting, exploration and
                controls; a ReThink step writes outcomes back into cross-round
                memory.
            - title: Does the memory actually help
              text: >-
                In a same-fold, leak-free ablation, experimental memory beat the
                agent-only setting on **3 of 3 folds** for both final best-seen
                (+0.940 ± 0.524) and AULC (+0.500 ± 0.151). Three-channel
                evidence conditioning ranked first among 8 strategies on final
                best-seen (5.657 ± 0.534) and was the only one to improve three
                rounds in a row.
          metrics:
            - { value: "3 / 3", label: "Folds improved by memory" }
            - { value: "+0.940", label: "Final best-seen vs. agent-only" }
            - { value: "1 of 8", label: "Rank among evidence strategies" }

