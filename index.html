<!DOCTYPE html>
<html lang="en" data-lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dawei Huang · Generative modeling for protein design</title>
  <meta name="description"
    content="Dawei Huang builds latent representation spaces and inference-time search for generative models of interacting biomolecules. Tencent AI Lab, Foundation Model for Science." />
  <meta name="author" content="Dawei Huang" />
  <link rel="canonical" href="https://h-dw.github.io/" />

  <meta property="og:type" content="profile" />
  <meta property="og:title" content="Dawei Huang · Generative modeling for protein design" />
  <meta property="og:description"
    content="Latent representation spaces and inference-time search for generative models of interacting biomolecules." />
  <meta property="og:url" content="https://h-dw.github.io/" />
  <meta property="og:image" content="https://h-dw.github.io/assets/avatar.jpg" />
  <meta name="twitter:card" content="summary" />

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="alternate icon" href="assets/favicon.ico" />
  <link rel="apple-touch-icon" href="assets/avatar.jpg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="css/site.css" />
</head>

<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- ── Top bar ─────────────────────────────────────────────────────── -->
  <header class="topbar" id="topbar">
    <div class="shell topbar-inner">
      <a class="brand" href="#top">
        <span class="brand-mark" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
        </span>
        <span class="brand-name" data-bind="brand"></span>
      </a>

      <nav class="topnav" aria-label="Sections">
        <a href="#research" data-bind="nav.research"></a>
        <a href="#publications" data-bind="nav.publications"></a>
        <a href="#background" data-bind="nav.background"></a>
        <a href="#contact" data-bind="nav.contact"></a>
      </nav>

      <button class="lang-toggle" id="lang-toggle" type="button">
        <span data-bind="meta.switch_to"></span>
      </button>
    </div>
  </header>

  <main id="main">
    <!-- ── Hero: the instrument panel ────────────────────────────────── -->
    <section class="hero" id="top">
      <div class="shell hero-grid">

        <div class="hero-text">
          <img class="hero-avatar" src="assets/avatar.jpg" alt="Dawei Huang" width="72" height="72" />
          <p class="hero-eyebrow" data-bind="hero.eyebrow"></p>
          <h1 class="hero-name">
            <span class="hero-name-main" data-bind="hero.name"></span>
            <span class="hero-name-alt" data-bind="hero.name_native"></span>
          </h1>
          <p class="hero-thesis" data-bind-md="hero.thesis"></p>
          <div class="hero-actions" id="hero-actions"></div>
        </div>

        <figure class="cmap">
          <!-- axis proportions mirror SPLIT / N in js/contact-map.js -->
          <div class="cmap-axis" aria-hidden="true">
            <span class="cmap-axis-seg" style="flex:30" data-bind="hero.figure.label_target"></span>
            <span class="cmap-axis-seg" style="flex:22" data-bind="hero.figure.label_binder"></span>
          </div>
          <div class="cmap-frame">
            <canvas id="cmap-canvas" role="img"
              aria-label="Residue contact map of a two-chain protein complex. Two diagonal blocks show contacts within the target and within the binder; a highlighted off-diagonal block shows contacts across the interface."></canvas>
            <span class="cmap-tag cmap-tag-i" data-bind="hero.figure.label_interface"></span>
          </div>
          <figcaption>
            <span class="cmap-title" data-bind="hero.figure.title"></span>
            <span class="cmap-caption" data-bind-md="hero.figure.caption"></span>
          </figcaption>
        </figure>

      </div>
    </section>

    <!-- ── Ledger ────────────────────────────────────────────────────── -->
    <section class="ledger-band">
      <div class="shell">
        <dl class="ledger" id="ledger"></dl>
      </div>
    </section>

    <!-- ── Research ──────────────────────────────────────────────────── -->
    <section class="section" id="research">
      <div class="shell">
        <div class="section-head">
          <p class="eyebrow" data-bind="research.eyebrow"></p>
          <h2 class="section-title" data-bind="research.title"></h2>
          <p class="section-intro" data-bind-md="research.intro"></p>
        </div>
        <div class="arc" id="arc"></div>
      </div>
    </section>

    <!-- ── Publications ──────────────────────────────────────────────── -->
    <section class="section section-alt" id="publications">
      <div class="shell">
        <div class="section-head">
          <p class="eyebrow" data-bind="publications.eyebrow"></p>
          <h2 class="section-title" data-bind="publications.title"></h2>
          <p class="section-intro" data-bind-md="publications.note"></p>
        </div>
        <div class="pubs" id="pubs"></div>
      </div>
    </section>

    <!-- ── Background ────────────────────────────────────────────────── -->
    <section class="section" id="background">
      <div class="shell">
        <div class="section-head">
          <p class="eyebrow" data-bind="background.eyebrow"></p>
          <h2 class="section-title" data-bind="background.title"></h2>
        </div>
        <div class="positions" id="positions"></div>
        <div class="sidecards" id="sidecards"></div>
      </div>
    </section>

    <!-- ── Contact ───────────────────────────────────────────────────── -->
    <section class="section contact" id="contact">
      <div class="shell contact-inner">
        <p class="eyebrow" data-bind="contact.eyebrow"></p>
        <h2 class="section-title" data-bind="contact.title"></h2>
        <p class="contact-text" data-bind-md="contact.text"></p>
        <a class="contact-mail" id="contact-mail" href="mailto:dawei_huang@163.com"></a>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="shell footer-inner">
      <p class="footer-copy" id="footer-copy"></p>
      <p class="footer-note" data-bind="contact.footer_note"></p>
    </div>
  </footer>

  <noscript>
    <div class="shell noscript">
      This page renders its content with JavaScript. The same material is in the
      CV: <a href="assets/cv/Dawei-Huang-CV-EN.pdf">Dawei-Huang-CV-EN.pdf</a>.
    </div>
  </noscript>

  <script src="js/vendor/marked.min.js"></script>
  <script src="js/vendor/js-yaml.min.js"></script>
  <script src="js/brand-icons.js"></script>
  <script src="js/contact-map.js"></script>
  <script src="js/site.js"></script>
</body>

</html>
