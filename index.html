<!DOCTYPE html>
<html lang="en" data-lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dawei Huang · Latent generative structure design &amp; self-improving agents</title>
  <meta name="description"
    content="Dawei Huang works on latent representation spaces for generative structure design and on search loops that improve themselves from their own results." />
  <meta name="author" content="Dawei Huang" />
  <meta name="theme-color" content="#EEF0F1" />
  <link rel="canonical" href="https://h-dw.github.io/" />

  <meta property="og:type" content="profile" />
  <meta property="og:title" content="Dawei Huang · Latent generative structure design &amp; self-improving agents" />
  <meta property="og:description"
    content="Latent representation spaces for generative structure design, and search loops that improve themselves." />
  <meta property="og:url" content="https://h-dw.github.io/" />
  <meta property="og:image" content="https://h-dw.github.io/assets/hero-bg.jpg" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="alternate icon" href="assets/favicon.ico" />
  <link rel="apple-touch-icon" href="assets/portrait-sm.jpg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap"
    rel="stylesheet" />
  <link rel="preload" as="image" href="assets/hero-bg.jpg" />

  <link rel="stylesheet" href="css/site.css" />
</head>

<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- ── Top bar ─────────────────────────────────────────────────────── -->
  <header class="topbar" id="topbar">
    <div class="shell topbar-inner">
      <a class="brand" href="#top">
        <svg class="brand-mark" viewBox="0 0 22 16" aria-hidden="true">
          <path d="M2 8 H7 L12 4 H20 M12 12 H20 M7 8 L12 12" />
          <circle cx="2" cy="8" r="1.6" class="brand-dot-a" />
          <circle cx="20" cy="4" r="2" class="brand-dot-b" />
          <circle cx="20" cy="12" r="1.4" class="brand-dot-c" />
        </svg>
        <span class="brand-name" data-bind="brand"></span>
      </a>

      <nav class="topnav" aria-label="Sections">
        <a href="#research" data-bind="nav.research"></a>
        <a href="#publications" data-bind="nav.publications"></a>
        <a href="#background" data-bind="nav.background"></a>
        <a href="#contact" data-bind="nav.contact"></a>
      </nav>

      <button class="lang-toggle" id="lang-toggle" type="button">
        <span data-bind="meta.switch_to"></span>
      </button>
    </div>
  </header>

  <main id="main">
    <!-- ── Hero ──────────────────────────────────────────────────────── -->
    <section class="hero" id="top">
      <div class="hero-photo" aria-hidden="true">
        <img src="assets/hero-bg.jpg" alt="" fetchpriority="high" />
      </div>
      <div class="shell hero-grid">
        <figure class="hero-portrait">
          <img src="assets/portrait.jpg" alt="" width="720" height="900" id="portrait" />
        </figure>
        <div class="hero-text">
          <p class="hero-eyebrow" data-bind="hero.eyebrow"></p>
          <h1 class="hero-name">
            <span class="hero-name-main" data-bind="hero.name"></span>
            <span class="hero-name-alt" data-bind="hero.name_native"></span>
          </h1>
          <p class="hero-thesis" data-bind-md="hero.thesis"></p>
          <div class="hero-actions" id="hero-actions"></div>
        </div>
      </div>
    </section>

    <!-- ── Process strip: the signature diagram ──────────────────────── -->
    <section class="strip">
      <div class="shell">
        <p class="eyebrow" data-bind="process.eyebrow"></p>
        <figure class="loop">
          <div class="loop-canvas">
            <canvas id="loop-canvas" role="img"
              aria-label="A diagram running left to right: a cloud of latent samples, a search tree whose weak branches are pruned and one of which is rolled back, and a surviving path that carries samples into an assembled structure."></canvas>
          </div>
          <figcaption>
            <ol class="loop-legend" id="loop-legend"></ol>
            <p class="loop-caption" data-bind-md="process.caption"></p>
          </figcaption>
        </figure>
      </div>
    </section>

    <!-- ── Ledger ────────────────────────────────────────────────────── -->
    <section class="ledger-band">
      <div class="shell">
        <dl class="ledger" id="ledger"></dl>
      </div>
    </section>

    <!-- ── Research ──────────────────────────────────────────────────── -->
    <section class="section" id="research">
      <div class="shell">
        <div class="section-head">
          <p class="eyebrow" data-bind="research.eyebrow"></p>
          <h2 class="section-title" data-bind="research.title"></h2>
          <p class="section-intro" data-bind-md="research.intro"></p>
        </div>
        <div class="tracks" id="tracks"></div>
      </div>
    </section>

    <!-- ── Publications ──────────────────────────────────────────────── -->
    <section class="section section-alt" id="publications">
      <div class="shell">
        <div class="section-head">
          <p class="eyebrow" data-bind="publications.eyebrow"></p>
          <h2 class="section-title" data-bind="publications.title"></h2>
          <p class="section-intro" data-bind-md="publications.note"></p>
        </div>
        <div class="pubs" id="pubs"></div>
      </div>
    </section>

    <!-- ── Background ────────────────────────────────────────────────── -->
    <section class="section" id="background">
      <div class="shell">
        <div class="section-head">
          <p class="eyebrow" data-bind="background.eyebrow"></p>
          <h2 class="section-title" data-bind="background.title"></h2>
        </div>
        <div class="positions" id="positions"></div>
        <div class="sidecards" id="sidecards"></div>
      </div>
    </section>

    <!-- ── Contact ───────────────────────────────────────────────────── -->
    <section class="section contact" id="contact">
      <div class="shell contact-inner">
        <p class="eyebrow" data-bind="contact.eyebrow"></p>
        <h2 class="section-title" data-bind="contact.title"></h2>
        <p class="contact-text" data-bind-md="contact.text"></p>
        <a class="contact-mail" id="contact-mail" href="mailto:dawei_huang@163.com"></a>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="shell footer-inner">
      <p class="footer-copy" id="footer-copy"></p>
      <p class="footer-note" data-bind="contact.footer_note"></p>
    </div>
  </footer>

  <noscript>
    <div class="shell noscript">
      This page renders its content with JavaScript. The same material is in the
      CV: <a href="assets/cv/Dawei-Huang-CV-EN.pdf">Dawei-Huang-CV-EN.pdf</a>.
    </div>
  </noscript>

  <script src="js/vendor/marked.min.js"></script>
  <script src="js/vendor/js-yaml.min.js"></script>
  <script src="js/brand-icons.js"></script>
  <script src="js/latent-search.js"></script>
  <script src="js/site.js"></script>
</body>

</html>
