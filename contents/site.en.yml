      number: "01"
      name: HackerChain
      subtitle: Hackathon startup workflow agent
      badge: "AI Future Hackathon · 8th place"
      summary: >-
        Built for first-time founders, HackerChain uses multi-round agents to
        extract structured requirements and generate a business plan, showcase
        webpage, brand poster and social content within one workspace—closing
        the loop from an initial conversation to publishable output.
