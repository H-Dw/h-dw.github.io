research:
  eyebrow: Research
  title: Two tracks, one loop
  intro: >-
    In my research, this view takes the form of two connected technical paths.
    **Latent-based generation** studies how representations preserve interfacial
    geometry, coupling and conformational distributions, and how they support
    generation, evaluation and inference-time search. **Agent-system governance**
    studies how iterative workflows coordinate models, tools, evidence and memory
    to enable verifiable execution and traceable scientific decisions.
    Representations define the information available to individual models.
    Governance integrates these partial views into a cycle of generation,
    verification and refinement.
  animation:
    title: Representation-Guided Generation and Agent-System Governance
    aria_label: >-
      Two small mage robots wave integrated magic wands and send luminous
      streams into Gaussian noise, forming a three-dimensional cartoon of the
      Rop protein four-helix homodimer before it dissolves back into noise.
  core_label: Core work
  details_label: Method contributions
  tracks:
    - id: latent
      numeral: I
      label: Latent-based generation
      note: >-
        A searchable latent space organizes structural information for generation,
        evaluation and inference-time search.
      stages:
        - id: space
          core: true
          title: Co-denoising Binder Design in a Unified Complex Latent Space
          subtitle: Jointly representing interface geometry and target–binder coupling
          tags:
            - { text: "NeurIPS 2026 · under review", kind: accent }
            - { text: "First author", kind: accent }
          question: >-
            Mainstream binder-design methods encode targets and binders
            independently, preventing joint modeling of interfacial geometry and
            target–binder coupling. The resulting omission of induced-fit effects
            often produces binders with loose interfacial packing and inefficient
            contacts.
          insight: >-
            Project the entire target–binder complex into a **unified latent
            space** and jointly denoise both components, preserving interfacial
            coupling while avoiding expensive coordinate-space decoding.
          contributions:
            - title: All-atom complex representation
              text: >-
                Designed an interaction-aware all-atom autoencoder whose bottleneck
                preserves both interfacial geometry and target–binder relational
                topology. Achieved all-atom reconstruction **DockQ > 0.90** on a
                CASP complex benchmark, substantially outperforming the baseline.
            - title: Latent co-denoising
              text: >-
                Jointly denoised the target and binder in latent space, allowing
                the target's local conformation to adapt to the binder and
                explicitly modeling induced fit.
            - title: Inference-time search in latent space
              text: >-
                Scored and filtered intermediate latent states directly without
                coordinate-space decoding. Reduced inference time and GPU memory
                usage to **28.7%** and **11.6%** of Complexa, respectively, while
                improving designability by **20.8%** over the previous version.
            - title: Benchmark validation
              text: >-
                Generated binders outperformed baseline methods in contact
                efficiency and local interfacial packing density, producing
                physically plausible geometries and competitive complex-interface
                quality.
          metrics:
            - { value: "> 0.90", label: "All-atom DockQ, CASP complexes" }
            - { value: "28.7%", label: "Inference time relative to baseline" }
            - { value: "11.6%", label: "GPU memory relative to baseline" }
            - { value: "+20.8%", label: "Designability gain over the previous version" }

        - id: signal
          title: "FANGS: Fragment-Aware Zero-Shot Ranking for Fusion-Protein Design"
          subtitle: Using local structural compatibility to prioritize candidates for wet-lab validation
          tags:
            - { text: "Manuscript in preparation", kind: muted }
            - { text: "Wet-lab validated", kind: accent }
          question: >-
            Generative models produce more fusion-protein candidates than
            wet-lab budgets can test. Candidate selection needs a ranking signal
            that tracks function; global confidence measures such as ipTM and
            pTM show limited correlation with experimental readouts.
          insight: >-
            FANGS first fixes the functional-state conformation, then uses
            fragment-level structural embeddings to model **local compatibility**
            between modules. Latent similarity becomes a zero-shot ranking signal
            that connects candidate generation with wet-lab prioritization.
          contributions:
            - title: Functional-state control
              text: >-
                Used conditional ESM3 generation to fix functional-state
                conformations. On fusion-protein test cases, ESM3-Template reduced
                structural error (RMSD) by **39%** relative to AF3.
            - title: Fragment-level compatibility ranking
              text: >-
                Built the compatibility score from similarities between
                fragment-level latent structural embeddings. Relative to global
                scores, FANGS increased Spearman correlation with experimental
                readouts by **more than 0.5**.
            - title: Two wet-lab case studies
              text: >-
                Applied FANGS ranking to two independent antibody-engineering
                tasks and validated shortlisted candidates with expression and
                affinity assays.
          metrics:
            - { value: "−39%", label: "Structural error relative to AlphaFold3" }
            - { value: "+0.5", label: "Spearman correlation gain" }
          case_results:
            label: Wet-lab cases
            summary: 2 independent tasks · both yielded successful candidates
            items:
              - target: Anti-TNF-alpha Nb
                task: Nb humanization
                outcome: Humanized Nb obtained
                evidence: Screening publicly available scaffold databases can identify scaffolds with binding affinities comparable to or stronger than those of their corresponding wild-type (WT) counterparts
              - target: Anti-snake-venom Ab
                task: Ab-to-humanized-Nb conversion
                outcome: Humanized Nb obtained
                evidence: Screening publicly available scaffold databases can identify scaffolds with binding affinities comparable to or stronger than those of their corresponding wild-type (WT) counterparts

        - id: prior
          title: "ESM3-MD: Dynamics-Informed Conformational Sampling via Molecular-Dynamics Distributions"
          subtitle: Injecting molecular-dynamics distributions into a pretrained structure module
          tags:
            - { text: "Ongoing", kind: muted }
            - { text: "Related work under review at NeurIPS 2026 · co-first author", kind: muted }
          question: >-
            Molecular-dynamics simulations can cover broad conformational
            landscapes but are computationally expensive and sample inefficiently.
            Pretrained protein language models encode static structures well but
            do not model dynamic conformational distributions, making low-cost
            sampling of alternative conformations difficult.
          insight: >-
            Temporal information in molecular-dynamics trajectories can be
            encoded as a **conditional probability distribution** and injected
            efficiently into a pretrained model's structure module through LoRA,
            enabling the model to generate dynamic conformations.
          contributions:
            - title: Coevolution-aware fragment corpus
              text: >-
                A corpus built from homologous fragments carries co-evolutionary
                signal; the prompt is tuned by multi-objective combinatorial
                optimisation. Against the pretrained baseline, distance to the
                alternative state dropped **10%** and intermediate-state
                diversity rose **9%**.
            - title: ESM3-MD fine-tuning framework
              text: >-
                Converted temporal information from molecular-dynamics
                trajectories into a probability distribution and used LoRA to
                parameter-efficiently fine-tune the ESM3 structure module,
                improving conformational coverage by approximately **22%** over
                conventional methods.
          metrics:
            - { value: "−10%", label: "Distance to alternative state" }
            - { value: "+9%", label: "Intermediate diversity" }
            - { value: "+22%", label: "Conformational coverage" }

    - id: agents
      numeral: II
      label: Agent-system governance
      note: >-
        BinderLoop governs execution state, keeping agent scheduling, verification
        and rollback controllable. EvoSEEK governs knowledge state, keeping
        scientific evidence, experimental memory and hypothesis formation traceable.
      stages:
        - id: harness
          title: "BinderLoop: Self-improvement Harness for Protein Binder Design"
          subtitle: Verifier-guided generator-configuration optimization under a fixed compute budget
          tags:
            - { text: "System · closed loop", kind: muted }
          question: >-
            Existing binder-design workflows often rely on one-shot, large-scale
            sampling and filtering. Strategy variables such as binder length,
            hotspot conditioning, filtering thresholds, sampling budget and local
            structural templates are commonly set heuristically, wasting compute
            on degrading branches for difficult targets.
          insight: >-
            Formulate protein binder design as **verifier-guided sequential
            optimization of generator configurations**. At each round, the
            controller updates input constraints, sampling budgets and
            branch/rollback decisions from observed structural rewards under a
            fixed compute budget.
          contributions:
            - title: Strategy-level active learning
              text: >-
                Built a multi-agent closed-loop harness that orchestrates parameter
                configuration, job execution, result evaluation and configuration
                updates. Introduced a composite reward and Advance/Rollback branch
                control to prevent linear progression along degrading branches.
            - title: Fragment-template memory
              text: >-
                Used LLM-based structural reasoning to identify reusable local
                interface fragments for subsequent rounds, retaining useful motifs
                when global scores were unstable.
            - title: LLM-guided self-correction
              text: >-
                Introduced failure-mode attribution and feedback-driven strategy
                adaptation. Across eight iterations, best ipTM improved by **11%**
                for SC2RBD and **12%** for PD-L1, while successful refolds
                increased **7-fold** and **2.82-fold**, respectively.
          metrics:
            - { value: "+11% / +12%", label: "Best ipTM on two targets" }
            - { value: "7× / 2.82×", label: "Successful refolds" }
            - { value: "8", label: "Closed-loop rounds" }

        - id: evoseek
          title: "EvoSEEK: Evidence-Governed Multi-Agent Protein Directed Evolution"
          subtitle: Cross-round decisions driven by scientific-knowledge and experimental-memory graphs
          tags:
            - { text: "System · multi-agent", kind: muted }
          question: >-
            Directed evolution must search an exponential sequence space under
            sparse labels, strong epistasis and fixed assay budgets. Existing
            methods separate external knowledge from cross-round experimental
            memory, creating evidence conflicts and repeated failures.
          insight: >-
            Treat the task as an **evidence-governed sequential decision
            process**. Coupled scientific-knowledge and experimental-memory
            graphs turn external evidence and cross-round observations into
            traceable, reusable priors for hierarchical agents to generate,
            critique and revise falsifiable mutation hypotheses.
          contributions:
            - title: Dual-graph evidence governance
              text: >-
                Encoded frozen external scientific evidence in a traceable
                scientific-knowledge KG and linked hypotheses to observations
                through an experimental-memory KG. Enforced source, temporal and
                selection-eligibility gates through EvidencePack.
            - title: Hierarchical reasoning and decision loop
              text: >-
                Separated reasoning into physicochemical, conservation and
                structure Scientist/Critic channels under fail-closed contracts.
                Agent-UQ balanced hypothesis targeting, exploration and controls,
                while ReThink converted validation results into cross-round
                reflection and memory.
            - title: Controlled and held-out validation
              text: >-
                KG memory raised the final best-seen score by **21%** over
                Agent-only (itself **9%** over baseline), while active learning
                raised the Round-3 batch mean by **63%** over the matched KG-only
                setting. Within the KG run using physicochemical, conservation and
                structural evidence channels, the final best-seen score was **39%**
                above the initial best. Against the matched non-RAG setting, RAG
                improved held-out Spearman by **14%**.
          metrics:
            - { value: "+21%", label: "KG memory · final best-seen vs Agent-only (Agent-only vs baseline: +9%)" }
            - { value: "+63%", label: "Active learning · Round-3 batch mean vs KG-only" }
            - { value: "+39%", label: "Three-channel KG run · final best-seen vs initial best" }
            - { value: "+14%", label: "RAG · held-out Spearman vs non-RAG" }

projects:
  eyebrow: AI agent product practice
  title: Turning agent systems into usable product workflows
  intro: >-
    These two projects apply agent orchestration to startup content production
    and small-group city planning. Beyond orchestration itself, I focus on
    translating ambiguous intent into structured state, then making intermediate
    reasoning, constraints and outputs understandable and adjustable to users.
