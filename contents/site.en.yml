hero:
  name: Dawei Huang
  name_native: 黄达威
  eyebrow: Latent generative structure design · Self-improving agents
  thesis: >-
    I work on two things. **The latent space** a generative model uses to
    produce structure — geometric objects that have to fit each other rather
    than exist alone. And **the search that runs over it**, which should get
    better from its own results instead of replaying one fixed pipeline.
    Proteins are where I test both, because there an answer can be checked.
