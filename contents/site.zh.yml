publications:
  eyebrow: 成果
  title: 论文、在审稿件与专利
  note: >-
    已发表论文使用期刊记录中的官方英文题名。未公开最终标题的在审及原则接收工作，以英文研究方向概述代替，并标注投稿期刊或会议和作者位次。
  overview_label: 研究方向概述
  not_title_label: 非论文真实标题
  groups:
    - label: 在审稿件
