  name_native: 黄达威
  eyebrow: Latent-based generation · Agent-system governance
  thesis: >-
    I see each model as engaging with the world from a particular perspective. Inwardly, representation
    gathers complexity until material regularities appear. Outwardly, governance
    lets partial views test, correct and coordinate with one another. **Knowledge-guided representation
    gives both a common form.** It governs what compression leaves behind and
    lets plurality disclose the whole.
