research:
  eyebrow: 研究
  title: 两条主线，一个闭环
  intro: >-
    在我的研究中，这一视角形成两条相互衔接的技术路径。**隐空间生成**研究表征如何保留界面几何、耦合关系与构象分布，以及这些表征如何支持生成、评估与推理时搜索。**智能体系统**研究生成与实验工作流如何在迭代决策中协调模型、工具、证据与记忆，使执行过程可验证、状态转换可控、科学推理可追溯。表征界定每个模型可利用的信息，系统协作则将这些局部视角组织为生成、验证、学习与修正的闭环。
  animation:
    title: 表征驱动生成与智能体系统
    aria_label: >-
      两名小型法师机器人挥动一体化魔法棒，将发光流引入高斯噪声，生成 Rop 蛋白四螺旋同源二聚体的三维卡通结构，随后再溶解回噪声。
  core_label: 核心工作
  details_label: 方法贡献
  tracks:
    - id: latent
      numeral: I
      label: 隐空间生成
      note: >-
        可搜索的隐空间为生成、评估与推理时搜索组织结构信息。
      stages:
        - id: space
          core: true
          title: 统一复合体隐空间协同去噪蛋白质结合物设计
          subtitle: 统一表征界面几何与靶标–结合蛋白耦合关系
          tags:
            - { text: "NeurIPS 2026 · 审稿中", kind: accent }
            - { text: "第一作者", kind: accent }
          question: >-
            现有结合蛋白设计方法通常独立编码靶标与结合蛋白，因而难以联合建模界面几何与靶标–结合蛋白耦合。诱导契合效应的缺失容易导致生成结构的界面堆积松散、接触效率偏低。
          insight: >-
            将靶标–结合蛋白复合体整体投影至**统一隐空间**并协同去噪，在保留界面耦合的同时避免昂贵的坐标空间解码。
          contributions:
            - title: 全原子复合体表征
              text: >-
                设计互作感知的全原子自编码器，使表征瓶颈同时保留界面几何与靶标–结合蛋白关系拓扑。在 CASP 复合物测试集上，全原子重建达到 **DockQ > 0.90**，显著优于基线。
            - title: 隐空间协同去噪
              text: >-
                靶标与结合蛋白在隐空间同步去噪，使靶标局部构象能够适应结合蛋白，并显式建模诱导契合效应。
            - title: 隐空间推理阶段搜索
              text: >-
                直接对推理阶段的中间隐状态评分与过滤，避免坐标空间解码。推理耗时和显存开销仅为 Complexa 的 **28.7%** 和 **11.6%**，生成可设计性相较原版本提升 **20.8%**。
            - title: 结合蛋白设计测试验证
              text: >-
                生成的结合蛋白在接触效率和结合侧局部堆积密度上均优于主流方法，具有物理上合理的几何形状和有竞争力的复合体界面质量，可作为下游优化的候选起点。
          metrics:
            - { value: "> 0.90", label: "CASP 复合物全原子 DockQ" }
            - { value: "28.7%", label: "相对基线推理耗时" }
            - { value: "11.6%", label: "相对基线显存开销" }
            - { value: "+20.8%", label: "可设计性相对原版本提升" }

        - id: signal
          title: "FANGS：面向融合蛋白设计的片段感知零样本排序"
          subtitle: 以局部结构兼容度连接候选生成与实验筛选
          tags:
            - { text: "论文撰写中", kind: muted }
            - { text: "已获湿实验验证", kind: accent }
          question: >-
            生成模型可以快速提出大量融合蛋白候选，有限的实验预算要求在验证前准确排序。ipTM、pTM 等全局置信度与功能读数相关性有限，难以稳定识别高价值候选。
          insight: >-
            FANGS 先固定功能态构象，再用片段级结构嵌入刻画模块间的**局部兼容度**。隐空间相似度由此成为零样本排序信号，直接服务于实验优先级决策。
          contributions:
            - title: 多模态功能态控制
              text: >-
                利用 ESM3 条件生成固定功能状态构象。在融合蛋白测试案例中，ESM3-Template 的结构误差（RMSD）相较 AF3 降低 **39%**。
            - title: 片段级兼容度排序
              text: >-
                以片段级隐空间结构嵌入的相似度构建兼容度评分。相较全局评分，FANGS 与实验读数的 Spearman 相关系数提高 **0.5 以上**。
            - title: 两项实验案例
              text: >-
                将 FANGS 排序用于两个独立抗体工程任务，并以表达与亲和力实验验证入选候选。
          metrics:
            - { value: "−39%", label: "结构误差（对比 AlphaFold3）" }
            - { value: "+0.5", label: "Spearman 相关系数增量" }
          case_results:
            label: 实验案例
            summary: 2 项独立任务 · 均获得成功候选
            items:
              - target: Anti-TNF-α Nb
                task: Nb 人源化
                outcome: 成功获得人源化 Nb
                evidence: 可通过筛选现有公开 scaffold 数据库，获得结合亲和力与对应 WT 相当甚至更强的 scaffold
              - target: Anti-snake-venom Ab
                task: Ab → humanized Nb 转换
                outcome: 成功获得 humanized Nb
                evidence: 可通过筛选现有公开 scaffold 数据库，获得结合亲和力与对应 WT 相当甚至更强的 scaffold

        - id: prior
          title: "ESM3-MD：动力学信息增强的蛋白质动态构象采样"
          subtitle: 将分子动力学分布高效注入预训练结构模块
          tags:
            - { text: "进行中", kind: muted }
            - { text: "同方向工作在投 NeurIPS 2026 · 共同一作", kind: muted }
          question: >-
            分子动力学模拟能够覆盖广泛的构象空间，但计算开销高、采样效率有限。预训练结构模型擅长静态结构建模，却缺乏对动态构象分布的刻画，因而难以低成本采样替代构象。
          insight: >-
            将分子动力学轨迹中的时间演化信息编码为**条件概率分布**，再通过 LoRA 高效注入预训练模型的结构模块，使模型能够生成动态构象。
          contributions:
            - title: 共进化片段语料构建
              text: >-
                利用同源序列片段构建包含共进化信息的语料，并通过多目标组合优化策略优化提示。相较预训练模型，测试蛋白与替代构象的结构差异（RMSD）降低 **10%**，采样中间态多样性提升 **9%**。
            - title: ESM3-MD 微调框架
              text: >-
                将分子动力学轨迹的时间信息转换为概率分布，并通过 LoRA 对 ESM3 结构模块进行参数高效微调。相较传统方法，构象覆盖率提升约 **22%**。
          metrics:
            - { value: "−10%", label: "与异构态的距离" }
            - { value: "+9%", label: "中间态多样性" }
            - { value: "+22%", label: "构象覆盖率" }

    - id: agents
      numeral: II
      label: 智能体系统
      note: >-
        BinderLoop 协调执行状态，使智能体调度、验证与回滚保持可控；EvoSEEK 管理知识状态，使科学证据、实验记忆与假设形成过程保持可追溯。
      stages:
        - id: harness
          title: "BinderLoop：针对蛋白质结合物设计的自进化智能体系统"
          subtitle: 固定计算预算下的验证器引导生成配置优化
          tags:
            - { text: "系统 · 闭环", kind: muted }
          question: >-
            现有蛋白质结合物设计通常采用固定的生成–筛选流程。结合蛋白长度、热点残基、过滤阈值、采样预算和局部结构模板等策略变量多由经验设定，难以根据中间质量与失败模式动态更新，因而在困难靶标上浪费计算预算。
          insight: >-
            将蛋白质结合物设计建模为**验证器引导的生成配置序列优化问题**。控制器依据当前靶标结构与历史生成轨迹的验证结果，在固定计算预算下持续更新输入约束、采样预算和分支回滚决策。
          contributions:
            - title: 自适应推理策略
              text: >-
                结合蛋白长度、条件化目标、局部模板、过滤阈值和采样预算均根据每轮结构反馈更新。
            - title: 验证器引导的搜索控制
              text: >-
                构建可回放的闭环 Harness，使用复合奖励函数管理 Advance、Branch、Rollback 和 Stop 决策，避免在质量退化的搜索分支上持续消耗计算预算。
            - title: 片段模板记忆
              text: >-
                将高质量局部界面转化为可检索的片段模板记忆，作为后续轮次的生成约束或配置先验，使局部有效但全局评分不稳定的结构信息能够跨轮复用。经过 8 轮迭代，SC2RBD 和 PD-L1 的最优 ipTM 分别提升 **11%** 和 **12%**，成功重折叠数量分别提升 **7 倍**和 **2.82 倍**。
          metrics:
            - { value: "+11% / +12%", label: "两个靶点的最优 ipTM" }
            - { value: "7× / 2.82×", label: "成功重折叠数量" }
            - { value: "8", label: "闭环迭代轮数" }

        - id: evoseek
          title: "EvoSEEK：证据治理型多智能体蛋白定向进化"
          subtitle: 科学知识–实验记忆双图谱驱动的跨轮决策
          tags:
            - { text: "系统 · 多智能体", kind: muted }
          question: >-
            定向进化需要在少样本、强上位性和有限实验预算下搜索指数级序列空间。现有方法割裂外部知识与跨轮实验记忆，容易造成证据冲突和重复失败。
          insight: >-
            将任务重构为**证据治理的序列决策问题**。科学知识–实验记忆双图谱把外部知识与实验反馈沉淀为可追溯、可复用的决策先验，再由分层多智能体生成、审查并跨轮修订可证伪假设。
          contributions:
            - title: 双图谱证据治理
              text: >-
                将外部科研证据固化为可追溯的科学知识 KG，并以实验记忆 KG 关联假设与观察。EvidencePack 按来源、时效和选择资格实施证据门控。
            - title: 分层推理与决策闭环
              text: >-
                在 fail-closed 合同下组织理化性质、序列保守性和结构特征三个 Scientist/Critic 通道。Agent-UQ 依据不确定性平衡假设靶向、探索与对照，ReThink 则将验证结果转化为跨轮反思与记忆。
            - title: 对照与留出集验证
              text: >-
                KG memory 的最终 best-seen score 相较 Agent-only 提升 **21%**（Agent-only 相较 baseline 提升 **9%**）；active learning 使第 3 轮 batch mean 相较匹配的 KG-only 设置提升 **63%**。在理化性质、序列保守性与结构特征三证据通道的 KG 运行中，最终 best-seen score 相较初始 best 提升 **39%**。相较匹配的非 RAG 设置，RAG 的留出集 Spearman 提升 **14%**。
          metrics:
            - { value: "+21%", label: "KG memory · 最终 best-seen 相较 Agent-only（Agent-only 相较 baseline：+9%）" }
            - { value: "+63%", label: "Active learning · 第 3 轮 batch mean 相较 KG-only" }
            - { value: "+39%", label: "三证据通道 KG 运行 · 最终 best-seen 相较初始 best" }
            - { value: "+14%", label: "RAG · 留出集 Spearman 相较非 RAG" }

